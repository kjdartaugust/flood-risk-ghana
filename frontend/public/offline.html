<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · FloodWatch Ghana</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --text: #0c1524;
        --muted: #6a7486;
        --brand: #0a66ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0e15;
          --text: #eef2f8;
          --muted: #8b95a7;
          --brand: #4d8dff;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
      }
      button {
        height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 13px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" />
      <h1>You're offline</h1>
      <p>Flood risk and the rain forecast need a connection. Try again when you have signal.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
