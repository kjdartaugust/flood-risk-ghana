# Scheduled ETL for the free tier.
#
# Render's free plan has no background workers, so `app.etl.worker` (APScheduler)
# is never deployed and the rainfall/alert cycle never runs in production. This
# workflow is the substitute: GitHub Actions cron is free, and it calls a
# protected endpoint on the web service to do the work.
#
# This is NOT an uptime pinger. It runs every 3 hours to refresh forecast
# rainfall and re-evaluate route flood alerts — the service is free to sleep in
# between, and the first call after a sleep just eats the cold start.
#
# No shared secret: the job asks GitHub for a short-lived signed token (OIDC)
# naming this repo and this workflow, and the backend checks GitHub's signature.
# The one setting is where the backend lives, as a repository secret:
#   BACKEND_URL  e.g. https://floodwatch-backend-dlni.onrender.com
name: refresh

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: # lets you trigger a refresh by hand from the Actions tab

permissions:
  id-token: write # lets the job ask GitHub for the token that proves who it is

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rainfall + alert refresh
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Not configured (a fork, say)? Skip quietly. A scheduled job that
          # fails because a feature was never switched on emails the repo owner
          # every time it fires — 8 nags a day that say nothing except "you
          # haven't set this up". Silence is the correct signal for "off"; red
          # is for "broken".
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::BACKEND_URL not set — skipping refresh."
            echo "Set it as a repository secret to switch route alerts on (see README)."
            exit 0
          fi

          # Render's free instance spins down after ~15 min idle and takes up to
          # ~90 s to wake. Wake it first, so the token below (good for ~5 min)
          # isn't spent waiting out a cold start.
          curl -sS -o /dev/null --max-time 180 --retry 2 --retry-connrefused \
            "$BACKEND_URL/api/v1/health" || true

          # Fetch the rain here and hand it over. Open-Meteo's free API limits
          # each IP per day, and Render's free tier shares one outbound IP among
          # many apps, so the backend itself gets "Daily API request limit
          # exceeded". This job's IP is its own. The backend says exactly what
          # to fetch; if fetching here fails, the backend still gets to try.
          body=()
          if curl -sS --fail --max-time 60 -o /tmp/plan.json \
                "$BACKEND_URL/api/v1/internal/refresh/plan" &&
             curl -sS --fail-with-body --max-time 60 --retry 2 -o /tmp/rain.json \
                "$(jq -r .url /tmp/plan.json)"; then
            jq -n --slurpfile plan /tmp/plan.json --slurpfile rain /tmp/rain.json \
              '{points: $plan[0].points,
                forecasts: ($rain[0] | if type == "array" then . else [.] end
                            | map({hourly}))}' > /tmp/body.json
            body=(-H "Content-Type: application/json" --data @/tmp/body.json)
            echo "Fetched rain for $(jq '.points | length' /tmp/body.json) points."
          else
            echo "::warning::Could not fetch rain here ($(head -c 300 /tmp/rain.json 2>/dev/null)); the backend will try."
          fi

          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=floodwatch-refresh" | jq -r .value)
          echo "::add-mask::$token"

          # The refresh itself runs as a background task, so the endpoint
          # answers 202 straight away, with the run's id.
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-connrefused \
            -X POST "$BACKEND_URL/api/v1/internal/refresh" \
            -H "Authorization: Bearer $token" "${body[@]}")
          echo "HTTP $code"; cat /tmp/out.txt; echo
          # Anything but 202 is a real failure worth a red X.
          test "$code" = "202"

          # 202 only means "started". Wait for the run to say how it ended, so
          # a green check means rain was actually saved.
          run=$(jq -r .run /tmp/out.txt)
          for i in $(seq 1 30); do
            sleep 10
            curl -sS --max-time 30 -o /tmp/run.json \
              "$BACKEND_URL/api/v1/internal/refresh" || continue
            if jq -e --argjson id "$run" '.id == $id and .finished_at != null' \
                /tmp/run.json > /dev/null; then
              cat /tmp/run.json; echo
              if jq -e '.error == null and .rainfall_rows > 0' /tmp/run.json > /dev/null; then
                exit 0
              fi
              echo "::error::refresh $run saved no rain: $(jq -r '.error // "0 rows"' /tmp/run.json)"
              exit 1
            fi
          done
          echo "::error::refresh $run had not finished after 5 minutes"
          exit 1
