# Scheduled ETL for the free tier.
#
# Render's free plan has no background workers, so `app.etl.worker` (APScheduler)
# is never deployed and the rainfall/alert cycle never runs in production. This
# workflow is the substitute: GitHub Actions cron is free, and it calls a
# protected endpoint on the web service to do the work.
#
# This is NOT an uptime pinger. It runs every 3 hours to refresh forecast
# rainfall and re-evaluate route flood alerts — the service is free to sleep in
# between, and the first call after a sleep just eats the cold start.
#
# What keeps it going is a chain: each run, when it's done, starts the next one
# (workflow_dispatch with chain=true), and that run waits until 3 hours after
# the last refresh before refreshing. GitHub's own schedule drops most runs at
# busy times (26 of 64 in the 8 days to 13 Nov 2026; 4 of 28 hourly tries on
# 14-15 Nov), so it's only the backup that restarts the chain if it ever breaks.
# The waiting is a sleeping runner, which costs nothing on a public repo.
# An outside timer (cron-job.org, docs/DEPLOY.md section 5) is optional.
#
# No shared secret: the job asks GitHub for a short-lived signed token (OIDC)
# naming this repo and this workflow, and the backend checks GitHub's signature.
# The one setting is where the backend lives, as a repository secret:
#   BACKEND_URL  e.g. https://floodwatch-backend-dlni.onrender.com
name: refresh
run-name: ${{ inputs.chain && 'refresh (chain)' || 'refresh' }}

on:
  schedule:
    # The backup: if no chain run is alive, a try starts one (and refreshes now
    # if the last refresh is 2.5 hours old). Hourly, off the top of the hour.
    - cron: "43 * * * *"
  workflow_dispatch: # the chain, the outside timer, or you from the Actions tab
    inputs:
      chain:
        description: "Started by the previous run: wait until 3 hours after the last refresh"
        type: boolean
        default: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      actions: read # to see when this workflow last refreshed
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CHAIN: ${{ inputs.chain }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # When did a refresh last run, well or not? (Not just the last good one:
          # if the backend is down, the chain must still wait its 3 hours rather
          # than retry in a tight loop.) A skipped try has no refresh job, so look
          # at the job itself, not the run. Any API failure here fails this job,
          # which also stops the chain; the backup schedule restarts it.
          runs=$(gh api "repos/$REPO/actions/workflows/refresh.yml/runs?status=completed&per_page=20" --jq '.workflow_runs[].id')
          last=""
          for id in $runs; do
            last=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "refresh" and (.conclusion == "success" or .conclusion == "failure")) | .started_at')
            [ -n "$last" ] && break
          done
          age=999
          [ -n "$last" ] && age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          echo "Last refresh started $age minutes ago (${last:-never})."

          if [ "$CHAIN" = "true" ]; then
            wait=$(( 180 - age )); [ "$wait" -gt 175 ] && wait=175
            if [ "$wait" -gt 0 ]; then echo "Waiting $wait minutes."; sleep $(( wait * 60 )); fi
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The outside timer, or you by hand: always go.
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The backup schedule: leave it to the chain while one is alive.
          alive=$(gh api "repos/$REPO/actions/workflows/refresh.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .display_title == \"refresh (chain)\" and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$alive" -gt 0 ]; then echo "A chain run is alive; nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$age" -ge 150 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  refresh:
    needs: due
    if: needs.due.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job ask GitHub for the token that proves who it is
    # Two refreshes at once would each miss the alerts the other just raised and
    # send the same alert twice, so a second one waits for the first.
    concurrency:
      group: refresh
      cancel-in-progress: false
    steps:
      - name: Trigger rainfall + alert refresh
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Not configured (a fork, say)? Skip quietly. A scheduled job that
          # fails because a feature was never switched on emails the repo owner
          # every time it fires — 8 nags a day that say nothing except "you
          # haven't set this up". Silence is the correct signal for "off"; red
          # is for "broken".
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::BACKEND_URL not set — skipping refresh."
            echo "Set it as a repository secret to switch route alerts on (see README)."
            exit 0
          fi

          # Render's free instance spins down after ~15 min idle and takes up to
          # ~90 s to wake. Wake it first, so the token below (good for ~5 min)
          # isn't spent waiting out a cold start.
          curl -sS -o /dev/null --max-time 180 --retry 2 --retry-connrefused \
            "$BACKEND_URL/api/v1/health" || true

          # Fetch the rain here and hand it over. Open-Meteo's free API limits
          # each IP per day, and Render's free tier shares one outbound IP among
          # many apps, so the backend itself gets "Daily API request limit
          # exceeded". This job's IP is its own. The backend says exactly what
          # to fetch; if fetching here fails, the backend still gets to try.
          body=()
          if curl -sS --fail --max-time 60 -o /tmp/plan.json \
                "$BACKEND_URL/api/v1/internal/refresh/plan" &&
             curl -sS --fail-with-body --max-time 60 --retry 2 -o /tmp/rain.json \
                "$(jq -r .url /tmp/plan.json)"; then
            jq -n --slurpfile plan /tmp/plan.json --slurpfile rain /tmp/rain.json \
              '{points: $plan[0].points,
                forecasts: ($rain[0] | if type == "array" then . else [.] end
                            | map({hourly}))}' > /tmp/body.json
            body=(-H "Content-Type: application/json" --data @/tmp/body.json)
            echo "Fetched rain for $(jq '.points | length' /tmp/body.json) points."
          else
            echo "::warning::Could not fetch rain here ($(head -c 300 /tmp/rain.json 2>/dev/null)); the backend will try."
          fi

          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=floodwatch-refresh" | jq -r .value)
          echo "::add-mask::$token"

          # The refresh itself runs as a background task, so the endpoint
          # answers 202 straight away, with the run's id.
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-connrefused \
            -X POST "$BACKEND_URL/api/v1/internal/refresh" \
            -H "Authorization: Bearer $token" "${body[@]}")
          echo "HTTP $code"; cat /tmp/out.txt; echo
          # Anything but 202 is a real failure worth a red X.
          test "$code" = "202"

          # 202 only means "started". Wait for the run to say how it ended, so
          # a green check means rain was actually saved.
          run=$(jq -r .run /tmp/out.txt)
          for i in $(seq 1 30); do
            sleep 10
            curl -sS --max-time 30 -o /tmp/run.json \
              "$BACKEND_URL/api/v1/internal/refresh" || continue
            if jq -e --argjson id "$run" '.id == $id and .finished_at != null' \
                /tmp/run.json > /dev/null; then
              cat /tmp/run.json; echo
              if jq -e '.error == null and .rainfall_rows > 0' /tmp/run.json > /dev/null; then
                exit 0
              fi
              echo "::error::refresh $run saved no rain: $(jq -r '.error // "0 rows"' /tmp/run.json)"
              exit 1
            fi
          done
          echo "::error::refresh $run had not finished after 5 minutes"
          exit 1

  # Start the next run, whatever happened here (a failed refresh mustn't break
  # the chain), unless another chain run is already alive: the backup schedule
  # and a hand-started run join the chain instead of starting a second one.
  next:
    needs: [due, refresh]
    # Not when `due` itself failed: then the next run would fail the same way at
    # once, and so on. The backup schedule picks the chain up again.
    if: always() && needs.due.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write # to start this workflow again
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          alive=$(gh api "repos/$REPO/actions/workflows/refresh.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and .display_title == \"refresh (chain)\" and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$alive" -gt 0 ]; then echo "A chain run is already alive."; exit 0; fi
          gh workflow run refresh.yml -R "$REPO" --ref "$REF" -f chain=true
          echo "Started the next run."
